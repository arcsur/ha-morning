set_standby_timeout:
  name: Set Standby Timeout
  description: Updates the auto-sleep energy saving standby timeout on the Morning machine.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID (e.g. M_AC67B25AC974).
      example: "M_AC67B25AC974"
      selector:
        text:
    timeout:
      name: Timeout (seconds)
      description: Auto-sleep standby timer duration in seconds (between 300 and 7200).
      required: true
      default: 1800
      selector:
        number:
          min: 300
          max: 7200
          step: 60
          unit_of_measurement: s

reset_machine:
  name: Reset Machine
  description: Triggers a software reset on the Morning Coffee Machine.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:

check_updates:
  name: Check Updates
  description: Checks the Morning cloud backend for available firmware updates.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:

refill_water:
  name: Refill Water Tank
  description: Resets or tops up estimated water level in the Morning Coffee Machine reservoir.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:
    amount_ml:
      name: Amount (ml)
      description: Specific volume in ml to add to current level. If omitted, resets tank to full capacity.
      required: false
      selector:
        number:
          min: 1
          max: 3000
          step: 10
          unit_of_measurement: mL

record_purge:
  name: Record Purge Rinse
  description: Decrements the estimated water level in the Morning Coffee Machine reservoir for a purge rinse.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:
    amount_ml:
      name: Amount (ml)
      description: Specific volume in ml to deduct from reservoir. If omitted, uses configured purge volume.
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 5
          unit_of_measurement: mL

brew_recipe:
  name: Brew Recipe
  description: Initiates coffee extraction on the Morning Coffee Machine using a named profile or custom pressure curve.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:
    profile_id:
      name: Profile ID / Name
      description: ID or name of a profile to recall.
      selector:
        text:
    name:
      name: Recipe Name
      description: Custom recipe display name.
      selector:
        text:
    temperature:
      name: Temperature (°C)
      description: Brew temperature in Celsius.
      selector:
        number:
          min: 65
          max: 100
          step: 1
          unit_of_measurement: "°C"
    mass_output:
      name: Coffee Output (g)
      description: Target espresso output weight in grams.
      selector:
        number:
          min: 10
          max: 250
          step: 1
          unit_of_measurement: g
    water_output:
      name: Bypass Water (ml)
      description: Additional bypass water volume in ml.
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: mL
    bloom_duration:
      name: Bloom Duration (s)
      description: Pre-wet infusion duration in seconds.
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: s

cancel_brew:
  name: Cancel Brew
  description: Cancels ongoing extraction or heating cycle on the Morning Coffee Machine.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:

search_recipes:
  name: Search Recipes
  description: Searches Morning Cloud and partner roaster recipe catalogs.
  fields:
    query:
      name: Search Query
      description: Roaster name, bean name, or flavor keyword.
      required: true
      selector:
        text:
    page_size:
      name: Page Size
      description: Maximum number of results to return.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1

save_profile:
  name: Save Custom Profile
  description: Saves a named custom brew profile to local storage.
  fields:
    name:
      name: Profile Name
      description: Friendly name for the profile.
      required: true
      selector:
        text:
    temperature:
      name: Temperature (°C)
      default: 94
      selector:
        number:
          min: 65
          max: 100
          step: 1
          unit_of_measurement: "°C"
    mass_output:
      name: Coffee Output (g)
      default: 40
      selector:
        number:
          min: 10
          max: 250
          step: 1
          unit_of_measurement: g

toggle_favorite:
  name: Toggle Favorite
  description: Toggles favorite bookmark status for a recipe.
  fields:
    profile_id:
      name: Profile ID
      description: ID of the profile to bookmark or unbookmark.
      required: true
      selector:
        text:
