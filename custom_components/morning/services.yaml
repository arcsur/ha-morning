set_standby_timeout:
  name: Set Standby Timeout
  description: Updates the auto-sleep energy saving standby timeout on the Morning machine.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID (e.g. M_AC67B25AC974).
      example: "M_AC67B25AC974"
      selector:
        text:
    timeout:
      name: Timeout (seconds)
      description: Auto-sleep standby timer duration in seconds (between 300 and 7200).
      required: true
      default: 1800
      selector:
        number:
          min: 300
          max: 7200
          step: 60
          unit_of_measurement: s

reset_machine:
  name: Reset Machine
  description: Triggers a software reset on the Morning Coffee Machine.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:

check_updates:
  name: Check Updates
  description: Checks the Morning cloud backend for available firmware updates.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:

refill_water:
  name: Refill Water Tank
  description: Resets or tops up estimated water level in the Morning Coffee Machine reservoir.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:
    amount_ml:
      name: Amount (ml)
      description: Specific volume in ml to add to current level. If omitted, resets tank to full capacity.
      required: false
      selector:
        number:
          min: 1
          max: 3000
          step: 10
          unit_of_measurement: mL

record_purge:
  name: Record Purge Rinse
  description: Decrements the estimated water level in the Morning Coffee Machine reservoir for a purge rinse.
  fields:
    device_id:
      name: Device
      description: The Morning Coffee Machine device.
      selector:
        device:
          integration: morning
    machine_id:
      name: Machine ID
      description: Internal hardware machine ID.
      selector:
        text:
    amount_ml:
      name: Amount (ml)
      description: Specific volume in ml to deduct from reservoir. If omitted, uses configured purge volume.
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 5
          unit_of_measurement: mL
